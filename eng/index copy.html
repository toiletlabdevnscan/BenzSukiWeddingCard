<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benz & Suki's Wedding Invitation</title>
<style>
  /* Set the background and center the content */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-image: url('bg.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: sans-serif;
    overflow: hidden; /* Prevent scrollbars while pages turn */
  }

  /* =========================================
     Welcome Screen
     ========================================= */
  #welcome-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-image: url('bg.png'); /* Use the same background */
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 999;
    cursor: pointer;
    transition: opacity 1s ease, visibility 1s ease;
  }

  #welcome-screen.fade-out {
    opacity: 0;
    visibility: hidden;
  }

  .welcome-logo {
    width: 250px;
    max-width: 60vw;
    height: auto;
    margin-bottom: 20px;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
    animation: pulse 2s infinite ease-in-out;
  }

  .welcome-hint {
    color: #fff;
    background: rgba(0,0,0,0.5);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    letter-spacing: 0.5px;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  /* Card container */
  .card-wrapper {
    position: relative;
    width: 95vw;
    max-width: 1000px;
    perspective: 2500px; /* 3D depth */
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.3)); /* Card shadow */
    cursor: pointer;
    -webkit-tap-highlight-color: transparent; /* Remove blue highlight on mobile tap */
    opacity: 0;
    transition: opacity 1s ease 0.5s; /* Fade in after the welcome screen disappears */
  }

  .card-wrapper.show {
    opacity: 1;
  }

  /* Use an image to maintain the correct aspect ratio automatically */
  .size-reference {
    width: 100%;
    height: auto;
    display: block;
    opacity: 0;
    pointer-events: none;
  }

  /* Individual page class */
  .page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-origin: center center; /* Pivot point is at the center (card spine) */
    transform-style: preserve-3d;
    transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* Front and back faces of each page */
  .face {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden; /* Hide when flipped to the reverse side */
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* The reverse side of each page is pre-flipped */
  .face.back {
    transform: rotateY(180deg);
  }

  /* =========================================
     Assign images to each page
     ========================================= */
  #page1 { z-index: 2; }
  #page1 .front { background-image: url('1_2.png'); }
  #page1 .back { background-image: url('4_2.png'); }

  #page2 { z-index: 1; }
  #page2 .front { background-image: url('2_2.png'); }
  #page2 .back { background-image: url('5_2.png'); }

  /* Hint text at the bottom */
  .hint {
    position: absolute;
    bottom: -50px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(0,0,0,0.5);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 0.3s;
    letter-spacing: 0.5px;
  }

  /* Slight cover-opening effect on hover (desktop only) */
  @media (hover: hover) {
    .card-wrapper.state-0:hover #page1 { transform: rotateY(-5deg); }
    .card-wrapper.state-1:hover #page2 { transform: rotateY(-5deg); }
  }
</style>
</head>
<body>

<!-- Welcome Screen -->
<div id="welcome-screen">
  <img src="logo_final.png" class="welcome-logo" alt="Logo">
  <div class="welcome-hint">👉 Tap the screen to open the card</div>
</div>

<!-- Wedding Card -->
<div class="card-wrapper state-0" id="card">
  <img src="2_2.png" class="size-reference" alt="">
  
  <!-- Page 2 (content) -->
  <div class="page" id="page2">
    <div class="face front"></div>
    <div class="face back"></div>
  </div>

  <!-- Page 1 (cover) -->
  <div class="page" id="page1">
    <div class="face front"></div>
    <div class="face back"></div>
  </div>
  
  <div class="hint" id="hint-text">👉 Tap the right side to open the card</div>
</div>

<script>
  let currentState = 0; 
  let isWelcomed = false;

  const welcomeScreen = document.getElementById('welcome-screen');
  const card = document.getElementById('card');
  const p1 = document.getElementById('page1');
  const p2 = document.getElementById('page2');
  const hint = document.getElementById('hint-text');

  // Function to enter the card view
  function dismissWelcome() {
    if (isWelcomed) return;
    isWelcomed = true;
    
    welcomeScreen.classList.add('fade-out');
    card.classList.add('show');

    // Remove the welcome screen from the DOM after the animation ends
    setTimeout(() => {
      welcomeScreen.style.display = 'none';
    }, 1000);
  }

  // Tap the welcome screen to enter the card
  welcomeScreen.addEventListener('click', dismissWelcome);
  welcomeScreen.addEventListener('touchstart', dismissWelcome);

  // Optional: uncomment the line below to dismiss it automatically after 3 seconds.
  // setTimeout(dismissWelcome, 3000);

  // Control card page turns
  card.addEventListener('click', function(e) {
    if (!isWelcomed) return;

    const rect = card.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const isRightClick = clickX > rect.width / 2;

    if (isRightClick) {
      if (currentState === 0) {
        p1.style.transform = 'rotateY(-180deg)';
        currentState = 1;
      } else if (currentState === 1) {
        p2.style.zIndex = 3;
        p2.style.transform = 'rotateY(-180deg)';
        currentState = 2;
      }
    } else {
      if (currentState === 2) {
        p2.style.transform = 'rotateY(0deg)';
        setTimeout(() => { p2.style.zIndex = 1; }, 600);
        currentState = 1;
      } else if (currentState === 1) {
        p1.style.transform = 'rotateY(0deg)';
        currentState = 0;
      }
    }
    
    updateUI();
  });

  function updateUI() {
    card.className = 'card-wrapper show state-' + currentState;
    
    if (currentState === 0) {
      hint.innerHTML = '👉 Tap the right side to open the card';
    } else if (currentState === 1) {
      hint.innerHTML = '👈 Tap left to return to the first page | Tap right to view the back cover 👉';
    } else if (currentState === 2) {
      hint.innerHTML = '👈 Tap the left side to return inside';
    }
  }
</script>

</body>
</html>
